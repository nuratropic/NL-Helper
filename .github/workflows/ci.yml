name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # nl_helper.js должен совпадать со сборкой из src/, версии в заголовке и в коде — тоже
      - run: npm run check
      - run: npm test
